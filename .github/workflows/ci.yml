# Pull-request gates.
#
# Until now the only workflow was deploy-pages.yml, which runs *after* a change
# reaches main — so a broken build, a stale generated file, or a registry item
# whose manifest doesn't match its imports was only discovered once it was
# already published. These are the same gates a maintainer runs locally, so a
# green PR means the same thing as a clean working tree.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing here writes to the repo, publishes, or comments. `actions:
# read` lets a pull request download the screenshot baseline from main's run.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene — gen-changelog.mjs refuses
      # to truncate on a shallow tree and the changelog artifacts are no longer
      # committed, so a shallow checkout would build an empty changelog.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs docs:gen + registry:build via prebuild, so this also produces the
      # artifacts the parity check below compares against.
      - name: Build
        run: pnpm build

      # The registry audit: imports a manifest doesn't declare, dependencies with
      # no version range, registry dependencies no item provides, type tokens
      # paired with a leading-*/weight override, and any --chart-legacy-* token
      # reaching a shipped primitive.
      - name: Registry audit
        run: pnpm registry:check

      # The artifacts match their sources (parity, below); this proves they also
      # match their declared shape, so a token model that says something the
      # schema forbids — a legacy token exposed to Tailwind, say — fails here.
      - name: Schemas
        run: pnpm check:schemas

      # A design manifest names the system a design was built against and the
      # registry component behind each element. This runs the published,
      # dependency-free validator over the published example, so the schema,
      # the example and the validator a consumer downloads cannot disagree.
      - name: Design manifest
        run: pnpm check:design-manifest

      # A page may compose anything the docs document — a dialog demo uses a
      # button — but a demo reaching for a primitive no page installs leaves the
      # reader with code that will not compile and nowhere to find the piece.
      - name: Sections
        run: pnpm check:sections

      # Generated files are committed, so regenerating them must produce no diff.
      # A diff means someone hand-edited an output or forgot to regenerate after
      # changing its source — both of which used to reach main unnoticed.
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm build' and commit the result."
            git status --short
            git diff -- . ':!*.lock' | head -200
            exit 1
          fi
          echo "No diff — generated files match their sources."

      - name: Install Chromium for the browser gate
        run: pnpm exec playwright install chromium --with-deps

      # `pnpm build` only proves the shells got written; they are empty and every
      # section renders client-side, so the site can build fine and render
      # nothing. This loads every route in a real browser, both themes (the
      # shell's own toggle, checked on <html>), and screenshots each one.
      - name: Verify the built site renders, and screenshot every route
        run: pnpm verify:docs --all --shots shots

      # The screenshots are the visual baseline: every green run on main keeps
      # its set for 30 days, and a pull request compares against the newest one.
      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: docs-shots
          path: shots/
          retention-days: 30

      # `verify:docs` proves a page renders, not that it looks right — two card
      # defects passed every gate and were caught only by rendering them by hand.
      # On a pull request, diff this run's screenshots against the last green
      # run on main and put the changed routes in the job summary with a diff
      # image. A visual change is usually intended, so this reports and never
      # fails: the reviewer is the gate.
      - name: Fetch the screenshot baseline from the last green main run
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then echo "No green main run yet — nothing to compare against."; exit 0; fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name docs-shots --dir baseline \
            || echo "Run $run has no docs-shots artifact (expired, or before this gate existed) — nothing to compare against."

      - name: Compare the screenshots with the baseline
        if: github.event_name == 'pull_request' && hashFiles('baseline/**') != ''
        run: node scripts/compare-shots.mjs baseline shots --out shot-diffs --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the diff images
        if: github.event_name == 'pull_request' && hashFiles('shot-diffs/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-shot-diffs
          path: shot-diffs/
          retention-days: 14

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 5
